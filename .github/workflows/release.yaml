name: Release Features

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish Features
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish Features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release for a Feature version bump
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before_version="$(git show "${{ github.event.before }}:src/tools/devcontainer-feature.json" 2>/dev/null | jq -r '.version // empty' || true)"
          current_version="$(jq -r '.version' src/tools/devcontainer-feature.json)"
          if [[ -z "$before_version" || "$before_version" == "$current_version" ]]; then
            echo "Feature version did not change; no GitHub Release is needed."
            exit 0
          fi

          tag="feature_tools_${current_version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Tools $current_version" \
            --generate-notes
